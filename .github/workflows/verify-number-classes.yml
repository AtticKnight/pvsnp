name: Check the prime complement and four-square language

on:
  push:
    branches: [verify/nov27-primes-and-four-squares]

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the proof files with the pinned Lean and Mathlib versions
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: "false"
          build: "true"
          build-args: "+PvsNP.Units.m2_x_sum_four_squares_p +PvsNP.Units.m2_x_prime_conp"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
