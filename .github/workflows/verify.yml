name: Check the intermediate-language and reverse reductions

on:
  push:
    branches: [verify/nov27-language-invariants]

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the proof files with the pinned Lean and Mathlib versions
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: "false"
          build: "true"
          build-args: "+PvsNP.Units.m2_p_ne_np_ladner_props +PvsNP.Units.m2_npc_reverse"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
