name: Check triangular lengths, exponential padding and reductions

on:
  push:
    branches: [verify/nov27-padding]

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the proof files with the pinned Lean and Mathlib versions
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: "false"
          build: "true"
          build-args: "+PvsNP.Units.tl_lang_len_tri_p +PvsNP.Units.m2_exp_poly_padding_iff +PvsNP.Units.m2_expc_compl +PvsNP.Units.m2_nphard_iff_compl_conphard +PvsNP.Units.m2_join_karp_iff_both +PvsNP.Units.m2_join_self_karp_equiv +PvsNP.Units.m2_join_swap_karp"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
