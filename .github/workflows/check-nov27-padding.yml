name: Check the Hamming relation, bit transducer and closure proofs

on:
  push:
    branches: [verify/nov27-padding]

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LEAN_NUM_THREADS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check the proof files with the pinned Lean and Mathlib versions
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          auto-config: "false"
          build: "true"
          build-args: "+PvsNP.Units.tf_fun_zip_with +PvsNP.Units.tr_rel_hamming_le +PvsNP.Units.m2_fixed_quotient_p_np +PvsNP.Units.m2_fixed_quotient_conp_exp +PvsNP.Units.m2_self_concat_preimage +PvsNP.Units.m2_np_eq_conp_iff_conphard_in_np +PvsNP.Units.m2_np_conp_no_nphard +PvsNP.Units.m2_np_eq_exp_np_conp +PvsNP.Units.m2_exp_iff_reduces_to_expc"
          use-mathlib-cache: "true"
          test: "false"
          lint: "false"
